name: Pruebas de calculadora y GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar pruebas con Pytest
        run: python -m pytest -v --junitxml=reportes/pytest.xml

      - name: Guardar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pytest
          path: reportes/pytest.xml
          if-no-files-found: warn

  pruebas-web:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probar JavaScript y archivos web
        run: node --test tests/test_calculadora_web.cjs

  preparar-pages:
    if: github.event_name != 'pull_request'
    needs: [pruebas, pruebas-web]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Preparar sitio estático
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets _site/assets
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio web
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publicar-pages:
    if: github.event_name != 'pull_request'
    needs: preparar-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4